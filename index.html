<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العبقري في الرياضيات | منصة تعليمية متكاملة</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
</head>
<body>

  <!-- Splash Screen -->
  <div id="splashScreen" class="splash-screen">
    <div class="splash-content">
      <img src="teacher.jpg" class="splash-img" id="splashImg">
      <div class="splash-welcome" id="splashWelcome">
        <i class="fas fa-calculator" style="font-size:2rem;color:var(--gold);display:block;margin-bottom:10px;"></i>
        <h2>مرحباً بكم في منصة العبقري التعليمية</h2>
      </div>
    </div>
  </div>

  <nav class="navbar" id="navbar" style="display: none;">
    <div style="display:flex;align-items:center;gap:15px;">
      <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="nav-brand">
        <i class="fas fa-calculator"></i>
        <span>العبقري في الرياضيات</span>
      </div>
    </div>
    <div class="user-menu">
      <span class="user-name" id="userName"></span>
      <div class="avatar" id="userAvatar"></div>
      <button class="btn btn-outline btn-sm" id="logoutButton">
        <i class="fas fa-sign-out-alt"></i> خروج
      </button>
    </div>
  </nav>

  <div class="toast" id="toast"></div>

  <div class="modal" id="generalModal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <div class="modal" id="examModal">
    <div class="modal-content exam-modal-content" style="max-width: 900px; max-height: 90vh;">
      <div id="examContent"></div>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="main-container">
    <div id="authPage" class="auth-container">
      <div class="auth-card">
        <div style="text-align: center; margin-bottom: 30px;">
          <i class="fas fa-calculator" style="font-size: 3rem; color: var(--gold);"></i>
          <h2 style="color: var(--gold); margin-top: 15px;">منصة العبقري في الرياضيات</h2>
          <p style="color: var(--text-secondary);">تسجيل الدخول</p>
        </div>

        <div class="form-group">
          <label for="loginRole">نوع المستخدم</label>
          <select class="form-control" id="loginRole">
            <option value="teacher">معلم</option>
            <option value="student">طالب</option>
            <option value="parent">ولي أمر</option>
          </select>
        </div>
        <div class="form-group">
          <label for="loginUsername">اسم المستخدم</label>
          <input type="text" class="form-control" id="loginUsername" placeholder="أدخل اسم المستخدم" autocomplete="off">
          <div class="error-text" id="usernameError"></div>
        </div>
        <div class="form-group">
          <label for="loginPassword">كلمة المرور</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="أدخل كلمة المرور" autocomplete="off">
          <div class="error-text" id="passwordError"></div>
        </div>
        <div id="loginError" style="color: var(--danger); text-align: center; margin: 10px 0; display: none;"></div>
        <button class="btn btn-gold btn-block" id="loginSubmitBtn">
          <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
        </button>
      </div>
    </div>

    <div id="dashboardPage" style="display: none;">
      <div class="dashboard-grid">
        <div class="sidebar" id="sidebar">
          <h3 style="color: var(--gold); margin-bottom: 20px;">
            <i class="fas fa-bars"></i> القائمة
          </h3>
          <ul class="sidebar-menu" id="sidebarMenu"></ul>
        </div>
        <div class="content-area" id="dashboardContent"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/security.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cloudinary.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/overview.js"></script>
  <script src="js/content.js"></script>
  <script src="js/exams.js"></script>
  <script src="js/students.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/student-view.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
